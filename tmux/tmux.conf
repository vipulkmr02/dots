# This is my TMUX configuration
## COLORS
fg=blue     # foreground color
s=yellow    # selected  color
bg=default      # background color

set -g default-terminal "screen-256color"
set -g prefix M-f
set -g prefix2 M-=    # Prefixes
set -g monitor-bell on    # will monitor for bells in panes
setw -g mode-keys vi    # set vim mode keys

# Status
set -g status-keys vi
set -g status-interval 1
set -g status-position top    # set status-bar position, values accepted = {bottom, top}
set -g status-justify left    # position of current panes
set -g mouse on    # use mouse
# set -g status off 	# status bar disable
set -g status-style "fg=$fg,bg=$bg"
set -g base-index 1

# Panes
set -g pane-base-index 1
set -g pane-active-border-style fg=$s
set -g pane-border-indicators colour    # a different style of pane indicator, values = {colour, arrows, both}
set -g pane-border-status off   # will show pane titles values { off, top, bottom }
set -g wrap-search on
set -g pane-border-style fg=$fg

set -g message-command-style fg=$fg
set -g message-style fg=$fg
set -g menu-selected-style fg=$s
set -g menu-style fg=$fg
set -g display-time 1

# Circular bar
nc=
ncf=
nc2=|
nc2f=|
# nc2=
# nc2f=

# Powerline bar
# nc=
# ncf=
nc2=
nc2f=

# Slant bar
nc=
ncf=
nc2=
nc2f=

# Removing them for a cleaner look
# nc=' '
# ncf=' '
nc2=
nc2f=

# Widgets
WIDGET="sh ~/.tmux/widgets.sh "
set -g window-status-separator $nc2
set -g window-status-current-format "#[bold,fg=$s]#($WIDGET random_emoji) #W "
set -g window-status-format " #I #W "
set -g window-status-last-style ''
set -g status-left "#[reverse] #S #I.#P #[noreverse]$nc #($WIDGET caps_lock)#{?#{window_zoomed_flag},󰁌 ,}"
# set -g status-left " #S/#I $nc2"
set -g status-left-length 20
STATUS_RIGHT=" $ncf#[reverse] 󰥔 %H:%M  $nc2 #($WIDGET battery) $nc2f #($WIDGET cpu) $nc2f #($WIDGET mem) #[noreverse]"
# STATUS_RIGHT="󰥔 %H:%M $nc2 #($WIDGET battery) $nc2f #($WIDGET cpu)% $nc2f #($WIDGET mem)% "
set -g status-right $STATUS_RIGHT
# set -g status-right " #S "
# set -g status-right "$ncf#[reverse] 󰒍 #S "

# Popup options
set -g popup-border-lines rounded

# Keybindings
bind-key M-. next-window
bind-key M-, previous-window
bind-key x kill-pane
bind-key - split-window -v -c "#{pane_current_path}"
bind-key _ split-window -h -c "#{pane_current_path}"
bind-key r source ~/.tmux.conf
bind-key e new-window -n "config:tmux" bash -c "cd ~/C8h11no2/.dots; nvim tmux.conf; ./place tmux.conf; tmux source ~/.tmux.conf"
bind-key R command-prompt "rename-session '%%'"
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key H resize-pane -L 5
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key L resize-pane -R 5
bind-key M-f last-window
bind-key M-i set status-position
bind-key X confirm-before -p "kill window '#W' (y/n)" kill-window
bind-key M-x confirm-before -p "kill server (y/n)" kill-server
bind-key M-c command-prompt "new-window '%%'"  # Dedicated window
bind-key f set-option status
bind-key u popup

# Keybindings for making Windows for specific programs
bind-key M-p new-window -c "#{pane_current_path}" zsh
bind-key M-n new-window notes  # Dedicated window
bind-key M-e new-window nvim  # Dedicated window
bind-key M-s new-window $SHELL  # Dedicated window
bind-key M-S new-window ssh 1.9.1.2  # Dedicated window

# Keybindings for npm
bind-key ! split-window -c "#{pane_current_path}" -h "source .env && npm run dev"

# Keybindings about Function keys
bind-key F2 command-prompt "new-session -s '%%'"
bind-key F3 setw synchronize-panes
bind-key F4 display-panes

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
